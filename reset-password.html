<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<section class="hero no-bg">
<div class="hero-content">
<h1>Trocar senha</h1>
<p>O suporte liberou uma janela temporaria para redefinir a senha da sua conta.</p>
</div>
</section>

<div class="auth-box">
<h2 class="page-title">Nova senha</h2>
<form id="resetPasswordForm">
<input type="password" id="newPassword" placeholder="Nova senha" required>
<input type="password" id="confirmPassword" placeholder="Confirmar nova senha" required>
<button class="btn" type="submit">Salvar nova senha</button>
</form>
<p class="muted" style="margin-top:14px">Se essa liberacao expirar, fale novamente com o suporte no Discord.</p>
</div>

<script src="/js/site-ui.js"></script>
<script src="/js/reset-password-page.js"></script>
</body>
</html>
